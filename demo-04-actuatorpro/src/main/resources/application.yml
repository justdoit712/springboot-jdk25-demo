server:
  port: 8085
  servlet:
    context-path: /admin-demo

spring:
  application:
    name: actuator-pro-server
  boot:
    admin:
      client:
        # 将自己作为 Client 注册到 Admin Server
        url: http://localhost:8085/admin-demo
        instance:
          prefer-ip: true

# 暴露 Actuator 端点供 Admin Server 读取
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
