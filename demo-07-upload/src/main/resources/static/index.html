<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>文件上传测试页面</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>测试上传文件到 Spring Boot</h2>
    <!-- 重点：文件上传的表单，必须指定 enctype 为 multipart/form-data -->
    <form action="/demo/upload/single" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required style="margin-bottom: 20px; display: block;" />
        <button type="submit" style="padding: 10px 20px; cursor: pointer;">立即上传</button>
    </form>
</body>
</html>
