server:
  port: 8086
  servlet:
    context-path: /demo

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接到本地 MySQL 数据库 demo-jdk25
    url: jdbc:mysql://localhost:3306/demo-jdk25?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456 # 请根据您本机的实际密码进行修改

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo05.mybatis.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
